{% set name = "trackio" %}
{% set version = "0.40.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # trackio stopped publishing PyPI sdists at 0.20.0 (last sdist: 0.5.1), so the
  # gradio pattern (build from the sdist, which bundles the prebuilt frontend) is
  # not available. The GitHub archive needs `npm ci` to compile the Svelte
  # frontend, which fails in the network-isolated PBP builder. So we repack the
  # official py3-none-any wheel (pure Python + prebuilt frontend).
  url: https://files.pythonhosted.org/packages/8f/60/69c8baac61bab8be099d54bc227cc5db845f7f2deaa69a3105e45fbca8c5/trackio-{{ version }}-py3-none-any.whl
  sha256: d3815222da697432cd4232f254b5b2b60aaa1e5b87bfff8f41101807b3fe7bc1

build:
  number: 0
  script: {{ PYTHON }} -m pip install trackio-{{ version }}-py3-none-any.whl --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - hatchling>=1.27
  run:
    - python
    - huggingface_hub >=1.10.0,<2.0.0
    - gradio-client >=2.0.0,<3.0.0
    - starlette <2.0.0
    - python-multipart >=0.0.9,<1.0.0
    # upstream declares uvicorn[standard]; uvicorn-standard is the conda form
    # (pulls websockets etc., not provided transitively by gradio-client/starlette)
    - uvicorn-standard >=0.30.0,<1.0.0
    - numpy <3.0.0
    - pillow <13.0.0
    - orjson >=3.0,<4.0.0
    - brotli >=1.0.0,<2.0.0
    - tomli >=2.0.0  # [py<311]
  run_constrained:
    - tbparse ==0.0.9
    - tensorboardx >=2.0.0,<3.0.0
    - nvidia-ml-py >=12.0.0
    - pyarrow >=21.0
    - mcp >=1.0.0,<2.0.0
    - psutil >=5.9.0

test:
  imports:
    - trackio
  commands:
    - pip check
    # trackio is library-first; the `trackio` CLI launches a Gradio dashboard and
    # its import chain (trackio.cli -> trackio.server) fails on Windows, while
    # `import trackio` + pip check pass. Skip the CLI smoke on win.
    - trackio --help  # [not win]
  requires:
    - pip

about:
  home: https://github.com/gradio-app/trackio
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A lightweight, local-first and free experiment tracking library built by Hugging Face
  description: |
    trackio is a lightweight, local-first, free experiment-tracking Python library
    built by Hugging Face. It provides a wandb-compatible API for logging metrics
    and visualizing runs through a local Gradio dashboard, with optional syncing to
    Hugging Face Spaces.
  doc_url: https://github.com/gradio-app/trackio
  dev_url: https://github.com/gradio-app/trackio

extra:
  skip-lints:
    # numpy is a CBC-pinned runtime-only dep (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
    - flferretti
