{% set name = "trackio" %}
{% set version = "0.27.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # trackio publishes only a wheel on PyPI (no sdist). Building from the GitHub
  # source requires `npm ci` to compile the Svelte frontend, which is infeasible
  # in the network-isolated build env. We repack the official py3-none-any wheel
  # (pure Python + prebuilt frontend).
  url: https://files.pythonhosted.org/packages/55/a1/af5437b3c3f04a0de85f6af2fb43db69c03cdebcea0330356e13724c2c3a/trackio-{{ version }}-py3-none-any.whl
  sha256: 2cb14d766d4798430e89d77c47b9e96af56062294ab9dcc555f5b42331aceba3

build:
  number: 0
  script: {{ PYTHON }} -m pip install trackio-{{ version }}-py3-none-any.whl --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
  run:
    - python
    - huggingface_hub >=1.10.0,<2.0.0
    - gradio-client >=2.0.0,<3.0.0
    - starlette <2.0.0
    - python-multipart >=0.0.9,<1.0.0
    - uvicorn >=0.30.0,<1.0.0
    - numpy <3.0.0
    - pillow <13.0.0
    - orjson >=3.0,<4.0.0
    - tomli >=2.0.0  # [py<311]
    # audioop was removed from the stdlib in 3.13; backport only needed there
    - audioop-lts  # [py>=313]
  run_constrained:
    - tbparse ==0.0.9
    - tensorboardx >=2.0.0,<3.0.0
    - nvidia-ml-py >=12.0.0
    - pyarrow >=21.0
    - mcp >=1.0.0,<2.0.0
    - psutil >=5.9.0

test:
  imports:
    - trackio
  commands:
    - pip check
    - trackio --help
  requires:
    - pip

about:
  home: https://github.com/gradio-app/trackio
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A lightweight, local-first and free experiment tracking library built by Hugging Face
  description: |
    trackio is a lightweight, local-first, free experiment-tracking Python library
    built by Hugging Face. It provides a wandb-compatible API for logging metrics
    and visualizing runs through a local Gradio dashboard, with optional syncing to
    Hugging Face Spaces.
  doc_url: https://github.com/gradio-app/trackio
  dev_url: https://github.com/gradio-app/trackio

extra:
  skip-lints:
    # numpy is a CBC-pinned runtime-only dep (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
    - flferretti
